name: Build signed store packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store package to build
        required: true
        type: choice
        options:
          - android
          - ios
          - both
          - app-store-status
          - ios-upload-existing
          - ios-duo-smoke
      artifact_run_id:
        description: Existing successful signed IPA artifact run (upload-only mode)
        required: false
        default: '43492722230'
        type: string
      app_store_action:
        description: App Store management action (only with app-store-status)
        required: false
        default: inspect
        type: choice
        options:
          - inspect
          - prepare
          - submit
      upload_ios_to_testflight:
        description: Upload the signed iOS package to TestFlight
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read

jobs:
  identity:
    if: inputs.platform != 'app-store-status' && inputs.platform != 'ios-upload-existing' && inputs.platform != 'ios-duo-smoke'
    name: Identity service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test WhatsApp and email OTP service
        working-directory: services/identity-worker
        run: node --test test/*.test.mjs

  app-store-status:
    if: inputs.platform == 'app-store-status'
    runs-on: macos-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - name: Inspect VoltMapEV App Store release status
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          APP_STORE_ACTION: ${{ inputs.app_store_action }}
        run: ruby mobile/tool/app_store_release.rb

  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    name: Signed Android App Bundle
    needs: identity
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Verify Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
      - name: Configure upload-key signing
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
          flutter test test/production_identity_fallback_test.dart \
            --dart-define=VOLTMAP_ENV=production
          flutter test test/production_identity_enabled_test.dart \
            --dart-define=VOLTMAP_ENV=production \
            --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
          flutter test test/production_charging_checkout_screen_test.dart \
            --dart-define=VOLTMAP_ENV=production \
            --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=https://api.voltmapev.com \
            --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
          flutter test test/production_app_review_access_test.dart \
            --dart-define=VOLTMAP_ENV=production
      - name: Build signed Android App Bundle
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --dart-define=VOLTMAP_ENV=production
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=${{ vars.VOLTMAP_PAYMENT_API_BASE_URL }}
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
          --dart-define=VOLTMAP_REALTIME_CHARGER_API_BASE_URL=${{ vars.VOLTMAP_REALTIME_CHARGER_API_BASE_URL }}
      - name: Upload signed Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmapev-android-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    name: Signed iOS App Store package
    needs: identity
    runs-on: xcode-27
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Select iPhone Duo toolchain
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
      - name: Verify App Store toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_MAJOR=$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$XCODE_MAJOR" -ge 27
          test "$SDK_MAJOR" -ge 27
      - name: Verify Apple signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$TEAM_ID"
          test -n "$PROFILE_NAME"
      - name: Install Apple distribution identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Configure iOS release signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Manual\nPROVISIONING_PROFILE_SPECIFIER=%s\nCODE_SIGN_IDENTITY=Apple Distribution\n' \
            "$TEAM_ID" "$PROFILE_NAME" >> ios/Flutter/Release.xcconfig
          sed -e "s/__APPLE_TEAM_ID__/$TEAM_ID/g" \
              -e "s/__IOS_PROFILE_NAME__/$PROFILE_NAME/g" \
              ios/ExportOptions.plist.template > ios/ExportOptions.plist
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
          flutter test test/production_charging_checkout_screen_test.dart \
            --dart-define=VOLTMAP_ENV=production \
            --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=https://api.voltmapev.com \
            --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
          flutter test test/production_app_review_access_test.dart \
            --dart-define=VOLTMAP_ENV=production \
            --dart-define=VOLTMAP_APP_STORE_BUILD=true
      - name: Build signed iOS package
        working-directory: mobile
        run: >-
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          --dart-define=VOLTMAP_APP_STORE_BUILD=true
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=${{ vars.VOLTMAP_PAYMENT_API_BASE_URL }}
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
          --dart-define=VOLTMAP_REALTIME_CHARGER_API_BASE_URL=${{ vars.VOLTMAP_REALTIME_CHARGER_API_BASE_URL }}
      - name: Upload signed iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmapev-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: inputs.upload_ios_to_testflight
        working-directory: mobile
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"

  upload-existing-ios:
    if: inputs.platform == 'ios-upload-existing'
    name: Upload verified existing iOS package
    runs-on: xcode-27
    timeout-minutes: 15
    steps:
      - name: Select release upload toolchain
        run: sudo xcode-select --switch /Applications/Xcode_27.1.app/Contents/Developer
      - name: Download the signed IPA from the specified build
        uses: actions/download-artifact@v4
        with:
          name: voltmapev-ios-ipa
          path: ios-upload
          run-id: ${{ inputs.artifact_run_id }}
          github-token: ${{ github.token }}
      - name: Verify release identity and upload to Apple
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -o pipefail
          IPA_PATH=$(find ios-upload -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          unzip -q "$IPA_PATH" -d "$RUNNER_TEMP/ipa-inspect"
          APP_PATH=$(find "$RUNNER_TEMP/ipa-inspect/Payload" -maxdepth 1 -name '*.app' -print -quit)
          BUNDLE_ID=$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP_PATH/Info.plist")
          APP_VERSION=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP_PATH/Info.plist")
          APP_BUILD=$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP_PATH/Info.plist")
          APP_SDK=$(/usr/libexec/PlistBuddy -c 'Print DTSDKName' "$APP_PATH/Info.plist")
          test "$BUNDLE_ID" = 'in.voltmap.voltmap'
          test "$APP_VERSION" = '1.15.13'
          test "$APP_BUILD" = '45'
          test "$APP_SDK" = 'iphoneos27.1'
          printf 'Verified %s %s (%s), SDK %s\n' "$BUNDLE_ID" "$APP_VERSION" "$APP_BUILD" "$APP_SDK"
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          for UPLOAD_ATTEMPT in 1 2 3; do
            if xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID" 2>&1 | tee "$RUNNER_TEMP/ipa-upload.log"; then
              exit 0
            fi
            if ! grep -Eiq 'Cannot determine the Apple ID|required agreement|temporarily|service unavailable' "$RUNNER_TEMP/ipa-upload.log" || [ "$UPLOAD_ATTEMPT" = 3 ]; then
              exit 1
            fi
            sleep 30
          done

  duo-smoke:
    if: inputs.platform == 'ios-duo-smoke'
    name: iPhone Duo simulator validation
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Select Duo simulator toolchain
        timeout-minutes: 3
        run: |
          sudo xcode-select --switch /Applications/Xcode_27.2.app/Contents/Developer
          sudo xcodebuild -runFirstLaunch
      - name: Install Flutter
        timeout-minutes: 5
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Build the same release source for simulator
        timeout-minutes: 5
        working-directory: mobile
        run: |
          flutter pub get
          flutter build ios --simulator --debug \
            --dart-define=VOLTMAP_APP_STORE_BUILD=true \
            --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
      - name: Initialize the current Duo simulator runtime
        timeout-minutes: 12
        run: |
          echo 'Listing available simulators'
          perl -e 'alarm 120; exec @ARGV' xcrun simctl list devices available -j > "$RUNNER_TEMP/duo-devices.json"
          DUO_RUNTIME=$(ruby -rjson -e 'runtime = JSON.parse(File.read(ARGV.fetch(0))).fetch("devices").find { |name, devices| name.include?("iOS-27-2") && devices.any? { |device| device["deviceTypeIdentifier"] == "com.apple.CoreSimulator.SimDeviceType.iPhone-Duo" } }&.first; abort "iOS 27.2 runtime is unavailable" unless runtime; puts runtime' "$RUNNER_TEMP/duo-devices.json")
          DUO_UDID=$(xcrun simctl create "VoltMapEV Duo Verification" com.apple.CoreSimulator.SimDeviceType.iPhone-Duo "$DUO_RUNTIME")
          echo "DUO_UDID=$DUO_UDID" >> "$GITHUB_ENV"
          XCODE_APPLICATIONS="$(dirname "$(xcode-select -p)")/Applications"
          DEVICE_HUB_APP=$(find "$XCODE_APPLICATIONS" -maxdepth 2 -name DeviceHub.app -print -quit)
          test -n "$DEVICE_HUB_APP"
          echo 'Booting iPhone Duo and opening its Device Hub window'
          perl -e 'alarm 180; exec @ARGV' xcrun simctl boot "$DUO_UDID"
          open -a "$DEVICE_HUB_APP" "devices://device/open?id=$DUO_UDID"
          perl -e 'alarm 360; exec @ARGV' xcrun simctl bootstatus "$DUO_UDID" -b
          echo 'Probing the selected Duo simulator launch service'
          ps -axo pid,ppid,comm | grep -E 'launchd_sim|com[.]apple[.]datamigrator' > "$RUNNER_TEMP/duo-startup-processes.txt" || true
          perl -e 'alarm 60; exec @ARGV' xcrun simctl spawn "$DUO_UDID" launchctl list > "$RUNNER_TEMP/duo-readiness.txt"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/duo-devices-after-boot.json"
          echo 'Duo simulator is ready for app installation'
      - name: Launch and capture iPhone Duo
        timeout-minutes: 9
        working-directory: mobile
        run: |
          mkdir -p "$RUNNER_TEMP/duo-screenshots"
          echo 'Inspecting Duo display state'
          perl -e 'alarm 60; exec @ARGV' xcrun simctl io "$DUO_UDID" enumerate > "$RUNNER_TEMP/duo-screenshots/displays-before-install.txt"
          echo 'Installing VoltMapEV on the booted Duo simulator'
          perl -e 'alarm 360; exec @ARGV' xcrun simctl install "$DUO_UDID" build/ios/iphonesimulator/Runner.app
          xcrun simctl privacy "$DUO_UDID" grant location in.voltmap.voltmap
          xcrun simctl location "$DUO_UDID" set 17.385,78.4867
          perl -e 'alarm 45; exec @ARGV' xcrun simctl launch "$DUO_UDID" in.voltmap.voltmap
          sleep 20
          mkdir -p "$RUNNER_TEMP/duo-screenshots"
          xcrun simctl spawn "$DUO_UDID" launchctl list > "$RUNNER_TEMP/duo-screenshots/app-processes.txt"
          ruby -e 'line = File.readlines(ARGV.fetch(0)).find { |entry| entry.include?("in.voltmap.voltmap") && entry.split.first.to_s.match?(/^[0-9]+$/) }; abort "VoltMapEV process is not running after launch" unless line; puts "VoltMapEV remains running after launch"' "$RUNNER_TEMP/duo-screenshots/app-processes.txt"
          xcrun simctl io "$DUO_UDID" enumerate > "$RUNNER_TEMP/duo-screenshots/displays.txt"
          xcrun simctl help io > "$RUNNER_TEMP/duo-screenshots/simctl-io-help.txt" 2>&1
          xcrun simctl help ui > "$RUNNER_TEMP/duo-screenshots/simctl-ui-help.txt" 2>&1
          mkdir -p "$RUNNER_TEMP/duo-screenshots"
          perl -e 'alarm 60; exec @ARGV' xcrun simctl io "$DUO_UDID" screenshot "$RUNNER_TEMP/duo-screenshots/iphone-duo.png"
          sips -g pixelWidth -g pixelHeight "$RUNNER_TEMP/duo-screenshots/iphone-duo.png"
      - name: Collect simulator installer diagnostics
        if: always()
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/duo-screenshots"
          df -h > "$RUNNER_TEMP/duo-screenshots/host-disk.txt"
          vm_stat > "$RUNNER_TEMP/duo-screenshots/host-memory.txt"
          ps -axo pid,ppid,rss,comm | sort -nr -k3 | head -30 > "$RUNNER_TEMP/duo-screenshots/host-processes.txt" || true
          xcrun simctl help io > "$RUNNER_TEMP/duo-screenshots/simctl-io-help.txt" 2>&1
          xcrun simctl help ui > "$RUNNER_TEMP/duo-screenshots/simctl-ui-help.txt" 2>&1
          if [ -n "$DUO_UDID" ]; then
            perl -e 'alarm 45; exec @ARGV' xcrun simctl spawn "$DUO_UDID" log show --last 5m --style compact --predicate 'process == "installd" OR process == "SpringBoard" OR process == "Runner"' > "$RUNNER_TEMP/duo-screenshots/device-log.txt" 2>&1 || true
          fi
      - name: Save Duo screenshot and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voltmapev-iphone-duo-screenshot
          path: |
            ${{ runner.temp }}/duo-screenshots/
            ${{ runner.temp }}/duo-devices*.json
            ${{ runner.temp }}/duo-readiness.txt
            ${{ runner.temp }}/duo-startup-processes.txt
          if-no-files-found: warn
