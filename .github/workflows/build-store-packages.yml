name: Build signed store packages

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store package to build
        required: true
        type: choice
        options:
          - android
          - ios
          - both
      upload_ios_to_testflight:
        description: Upload the signed iOS package to TestFlight
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  android:
    if: inputs.platform == 'android' || inputs.platform == 'both'
    name: Signed Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Verify Android signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$KEY_ALIAS"
      - name: Configure upload-key signing
        working-directory: mobile/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > upload-keystore.jks
          printf 'storePassword=%s\nkeyPassword=%s\nkeyAlias=%s\nstoreFile=../upload-keystore.jks\n' \
            "$STORE_PASSWORD" "$KEY_PASSWORD" "$KEY_ALIAS" > key.properties
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
          flutter test test/production_charging_checkout_screen_test.dart \
            --dart-define=VOLTMAP_ENV=production \
            --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=https://api.voltmapev.com \
            --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
      - name: Build signed Android App Bundle
        working-directory: mobile
        run: >-
          flutter build appbundle --release
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=${{ vars.VOLTMAP_PAYMENT_API_BASE_URL }}
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=${{ vars.VOLTMAP_IDENTITY_API_BASE_URL }}
          --dart-define=VOLTMAP_REALTIME_CHARGER_API_BASE_URL=${{ vars.VOLTMAP_REALTIME_CHARGER_API_BASE_URL }}
      - name: Upload signed Android artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmapev-android-aab
          path: mobile/build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

  ios:
    if: inputs.platform == 'ios' || inputs.platform == 'both'
    name: Signed iOS App Store package
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Verify App Store toolchain
        run: |
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          XCODE_MAJOR=$(xcodebuild -version | awk '/Xcode/{split($2, version, "."); print version[1]}')
          SDK_MAJOR=$(xcrun --sdk iphoneos --show-sdk-version | cut -d. -f1)
          test "$XCODE_MAJOR" -ge 26
          test "$SDK_MAJOR" -ge 26
      - name: Verify Apple signing secrets
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          test -n "$CERTIFICATE_BASE64"
          test -n "$CERTIFICATE_PASSWORD"
          test -n "$PROFILE_BASE64"
          test -n "$KEYCHAIN_PASSWORD"
          test -n "$TEAM_ID"
          test -n "$PROFILE_NAME"
      - name: Install Apple distribution identity
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
          KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
        run: |
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/distribution.p12"
          printf '%s' "$PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/profile.mobileprovision"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/distribution.p12" -P "$CERTIFICATE_PASSWORD" -A -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/profile.plist")
          cp "$RUNNER_TEMP/profile.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
      - name: Configure iOS release signing
        working-directory: mobile
        env:
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: |
          printf '\nDEVELOPMENT_TEAM=%s\nCODE_SIGN_STYLE=Manual\nPROVISIONING_PROFILE_SPECIFIER=%s\nCODE_SIGN_IDENTITY=Apple Distribution\n' \
            "$TEAM_ID" "$PROFILE_NAME" >> ios/Flutter/Release.xcconfig
          sed -e "s/__APPLE_TEAM_ID__/$TEAM_ID/g" \
              -e "s/__IOS_PROFILE_NAME__/$PROFILE_NAME/g" \
              ios/ExportOptions.plist.template > ios/ExportOptions.plist
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Analyze and test
        working-directory: mobile
        run: |
          flutter analyze
          flutter test
          flutter test test/production_charging_checkout_screen_test.dart \
            --dart-define=VOLTMAP_ENV=production \
            --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=https://api.voltmapev.com \
            --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
      - name: Build signed iOS package
        working-directory: mobile
        run: >-
          flutter build ipa --release --export-options-plist=ios/ExportOptions.plist
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=${{ vars.VOLTMAP_PAYMENT_API_BASE_URL }}
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=${{ vars.VOLTMAP_IDENTITY_API_BASE_URL }}
          --dart-define=VOLTMAP_REALTIME_CHARGER_API_BASE_URL=${{ vars.VOLTMAP_REALTIME_CHARGER_API_BASE_URL }}
      - name: Upload signed iOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: voltmapev-ios-ipa
          path: mobile/build/ios/ipa/*.ipa
          if-no-files-found: error
      - name: Upload to TestFlight
        if: inputs.upload_ios_to_testflight
        working-directory: mobile
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          test -n "$API_KEY_ID"
          test -n "$API_ISSUER_ID"
          test -n "$API_KEY_BASE64"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY_BASE64" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          IPA_PATH=$(find build/ios/ipa -name '*.ipa' -print -quit)
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$API_KEY_ID" --apiIssuer "$API_ISSUER_ID"
