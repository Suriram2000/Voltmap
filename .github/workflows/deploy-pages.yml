name: Deploy Flutter web to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Test WhatsApp and email OTP service
        working-directory: services/identity-worker
        run: node --test test/*.test.mjs

      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Verify generated search pages
        run: python tool/generate_seo_city_pages.py --check

      - name: Analyze Dart source
        working-directory: mobile
        run: flutter analyze

      - name: Run Flutter tests
        working-directory: mobile
        run: flutter test

      - name: Run production-only checkout test
        working-directory: mobile
        run: >-
          flutter test test/production_charging_checkout_screen_test.dart
          --dart-define=VOLTMAP_ENV=production
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=https://api.voltmapev.com
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com

      - name: Build Flutter web app
        working-directory: mobile
        run: >-
          flutter build web --release --base-href "/"
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=${{ vars.VOLTMAP_PAYMENT_API_BASE_URL }}
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=${{ vars.VOLTMAP_IDENTITY_API_BASE_URL }}
          --dart-define=VOLTMAP_REALTIME_CHARGER_API_BASE_URL=${{ vars.VOLTMAP_REALTIME_CHARGER_API_BASE_URL }}

      - name: Add custom domain marker
        working-directory: mobile
        run: echo "voltmapev.com" > build/web/CNAME

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: mobile/build/web

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
