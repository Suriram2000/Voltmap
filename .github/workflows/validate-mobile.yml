name: Validate Flutter mobile apps

on:
  pull_request:
    paths:
      - "mobile/**"
      - "services/identity-worker/**"
      - ".github/workflows/validate-mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identity:
    name: Identity service tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Test WhatsApp and email OTP service
        working-directory: services/identity-worker
        run: node --test test/*.test.mjs

  android:
    name: Android debug build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Verify production checkout safeguards
        working-directory: mobile
        run: >-
          flutter test test/production_charging_checkout_screen_test.dart
          --dart-define=VOLTMAP_ENV=production
          --dart-define=VOLTMAP_PAYMENT_API_BASE_URL=https://api.voltmapev.com
          --dart-define=VOLTMAP_IDENTITY_API_BASE_URL=https://api.voltmapev.com
      - name: Build Android app
        working-directory: mobile
        run: flutter build apk --debug

  ios:
    name: iOS unsigned release build
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - name: Install Flutter
        uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          channel: stable
          cache: true
      - name: Install dependencies
        working-directory: mobile
        run: flutter pub get
      - name: Build iOS app without signing
        working-directory: mobile
        run: flutter build ios --release --no-codesign
