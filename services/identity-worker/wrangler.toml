name = "voltmapev-identity"
main = "src/worker.mjs"
compatibility_date = "2026-08-17"
workers_dev = false

routes = [
  { pattern = "api.voltmapev.com/v1/identity/*", zone_name = "voltmapev.com" },
  { pattern = "api.voltmapev.com/health", zone_name = "voltmapev.com" }
]

[[kv_namespaces]]
binding = "OTP_CHALLENGES"
id = "dcddb6d9a2284069a4002fc3eca35adb"

[[kv_namespaces]]
binding = "OTP_RATE_LIMITS"
id = "4de24e80cb25419faa885c41514d3658"

[vars]
ALLOWED_ORIGINS = "https://voltmapev.com,https://www.voltmapev.com,https://suriram2000.github.io"
WHATSAPP_GRAPH_API_VERSION = "v23.0"
WHATSAPP_AUTH_TEMPLATE = "voltmapev_authentication"
WHATSAPP_TEMPLATE_LANGUAGE = "en"
OTP_FROM_EMAIL = "VoltMapEV <verify@voltmapev.com>"
OTP_PILOT_MODE = "true"
