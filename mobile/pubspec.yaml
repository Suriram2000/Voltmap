publish_to: "none"
version: 1.13.2+20

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  url_launcher: ^6.3.0
  shared_preferences: ^2.3.2
  crypto: ^3.0.6
  http: ^1.2.2
